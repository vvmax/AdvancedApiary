# Advanced Apiary 0.6.1 — example server configuration
# Restart the game/server after changing this file.
bees {
    # true: disable effects, pollination, flower growth and external flower searches.
    # false: enable these activities. Climate/weather/light still apply in both modes.
    # Queens are immortal in both modes.
    B:disableBeeAI=false
}
genetics {
    B:requireAllGenesPure=false
}
production {
    I:cycleTicks=550
    S:productionMultiplier=1.0
    B:specialties=true
}
